name: Ubuntu LTS
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  buildLinux:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:jammy
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Get Dependencies
        run: |
          apt update && apt upgrade -y
          apt install -y software-properties-common g++ make cmake ninja-build wget rsync build-essential libglib2.0-0
          apt install -y libgl1-mesa-dev file libvulkan-dev openssl python3 python3-pip libxcb-cursor0 libxrandr2
          # The exporter links FFmpeg (libav*) directly; the dev headers/libs are
          # needed to build and linuxdeployqt bundles the shared libs at runtime.
          #
          # FFmpeg coupling / GPL note (see src/media/CMakeLists.txt):
          #  * pkg-config's default libavcodec here is the LGPL "free" build, which
          #    does NOT contain the GPL x264/x265 encoders the H.264/H.265 presets
          #    want. The export defaults therefore silently depend on WHICH libav* is
          #    linked. To make the shipped encoder set deterministic, Phase 7 builds
          #    FFmpeg from pinned source with --enable-gpl and points
          #    AE_FFMPEG_GPL_AVCODEC at it.
          #  * The app's Qt Multimedia (Qt 6.9 here) FFmpeg backend loads its OWN
          #    FFmpeg major; the app's directly-linked libav* must be the SAME major
          #    (soname) or both get loaded and clash. Keep them in lockstep.
          apt install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Get Python and install qt dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests semantic_version patch py7zr texttable bs4 defusedxml aqtinstall
      - name: Get Qt 6.9.*
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: "==3.3.*"
          version: '6.9.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: "qt5compat qtimageformats qtmultimedia qtwaylandcompositor"
          install-deps: "nosudo"
          setup-python: "false"
          tools: "tools_cmake tools_ninja tools_opensslv3_src"
      - name: Build AnimeEffects
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          # CI uses the distro's free (LGPL) libavcodec, which has no libx264/libx265.
          # Until Phase 7 builds a pinned GPL FFmpeg, explicitly accept the free-only
          # codec set so the build is deterministic (mp4 -> mpeg4) instead of erroring.
          cmake -S . -B build -G "Ninja Multi-Config" -DAE_ALLOW_FREE_CODECS_ONLY=ON
          cmake --build build --config Release
          cd build/src/gui/Release
          mkdir -p appdir
          cp AnimeEffects appdir
          cp -R ../../../../dist appdir/dist
          cp ../../../../dist/AnimeEffects.png appdir
          find appdir/
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -c -nv "https://github.com/p-yukusai/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          if [[ "$RELEASE_VERSION" != "" ]]; then export VERSION=$RELEASE_VERSION;fi
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage appdir/dist/AnimeEffects.desktop -extra-plugins=imageformats,multimedia,core5compat -appimage -verbose=2
          echo "artifactPath=$(realpath AnimeEffects-x86_64.AppImage)`"
          echo "artifactPath=$(realpath AnimeEffects-x86_64.AppImage)`" >> $GITHUB_ENV
      - name: Github Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimeEffects-Linux
          path: ${{ env.artifactPath }}
