name: MacOS 15 - Intel
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  buildMacOS:
    runs-on: macos-15-intel
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Brew
        shell: bash
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_VERBOSE_USING_DOTS=1
      - name: Get Qt 6.9.*
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: "==3.3.*"
          version: "6.9.3"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          modules: "qtimageformats qtmultimedia qt5compat"
          install-deps: "nosudo"
          tools: "tools_cmake tools_ninja"
      - name: Get dependencies
        shell: bash
        run: |
          brew install ninja vulkan-headers coreutils
          # The exporter links FFmpeg (libav*) directly.
          brew install ffmpeg
      - name: Build AnimeEffects
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          # The export presets need an explicit codec mode. Homebrew ffmpeg is a full
          # GPL build (has libx264), so AE_ALLOW_FREE_CODECS_ONLY is a harmless gate
          # here (the linked lib still provides x264); it just disables the strict
          # "must be GPL" configure error. Phase 7 will switch to a pinned GPL build.
          cmake -S . -B build -G "Ninja Multi-Config" -DAE_ALLOW_FREE_CODECS_ONLY=ON
          cmake --build build --config Release
          cd build/src/gui/Release
          mkdir appdir
          cp -R AnimeEffects.app appdir/AnimeEffects.app
          cp -R ../../../../dist appdir/AnimeEffects.app/dist
          find appdir/
          cd appdir
          macdeployqt AnimeEffects.app
          wget https://raw.githubusercontent.com/OpenZWave/ozw-admin/master/scripts/macdeployqtfix.py && chmod a+x macdeployqtfix.py
          ./macdeployqtfix.py AnimeEffects.app /usr/local/Cellar/qt/*/
          zip -r AnimeEffects.zip AnimeEffects.app runme.command
          echo -n "artifactPath=$(realpath AnimeEffects.zip)`"
          echo -n "artifactPath=$(realpath AnimeEffects.zip)`" >> $GITHUB_ENV
      - name: Run test suite (macOS)
        # Validates the refactor compiles and the core logic runs on macOS.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          for t in bonekey_regression rightclick_transient_selection creation_select_keys                    easing_regression easing_picker_layout picker_probe picker_pos_probe                    attribute_observable anim_settings_undo anim_setting_i18n; do
            ./build/tests/Release/$t
          done
      - name: Launch the app (smoke)
        # Best-effort runtime check: the app must start and stay up (timeout 124
        # means it ran to the deadline; 0 is a clean exit). continue-on-error so
        # a headless-runner GUI quirk does not block the packaged artifact.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 25 ./build/src/gui/Release/AnimeEffects.app/Contents/MacOS/AnimeEffects
          rc=$?
          echo "app launch rc=$rc"
          if [ "$rc" != "124" ] && [ "$rc" != "0" ]; then
            echo "APP EXITED UNEXPECTEDLY (rc=$rc)"; exit 1
          fi
      - name: Github Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimeEffects-MacOS
          path: ${{ env.artifactPath }}
          compression-level: 0
